name: Docker CI Experiment

on:
  push:
    branches:
      - experiment/docker-ci

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-quality:
    name: Build and Test in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android CI Docker Image
        run: docker build --platform linux/amd64 -f Dockerfile.ci -t weather-ai-android-ci .

      - name: Run Android Quality Checks in Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            weather-ai-android-ci \
            bash -c './gradlew :app:detekt ktlintCheck test assembleDebug'
